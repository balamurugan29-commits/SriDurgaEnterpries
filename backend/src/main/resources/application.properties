server.port=${PORT:8085}
spring.application.name=sri-durga-backend

# Embedded High-Performance File-Based Database (Persistent across restarts, 0 external RAM)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sridurgadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Database JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console for admin inspection (accessible via http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HTTP Gzip Compression (Reduces Wi-Fi payload transfer by 70%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Static Web Resource Caching
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=86400

# JWT Configuration
jwt.secret=SriDurgaSuperSecretKeyForJWTAuthTokenGeneration2026SecureKeyMustBeLongEnough
jwt.expiration-ms=86400000

# Multipart Upload Configuration for Total Database Backups
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
